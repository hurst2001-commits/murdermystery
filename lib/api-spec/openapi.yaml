openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: public
    description: Public Greyton Murder Mysteries content and enquiries
  - name: admin
    description: Authenticated booking management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /site-content:
    get:
      operationId: getSiteContent
      tags: [public]
      summary: Get the public website content
      responses:
        "200":
          description: Public website content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContent"
  /bookings:
    post:
      operationId: createBooking
      tags: [public]
      summary: Request a murder mystery night
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking enquiry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Invalid booking enquiry
  /custom-enquiries:
    post:
      operationId: createCustomEnquiry
      tags: [public]
      summary: Request a personalised murder mystery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomMysteryInput"
      responses:
        "201":
          description: Personalised enquiry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomMysteryEnquiry"
        "400":
          description: Invalid personalised enquiry
  /public-event:
    get:
      operationId: getPublicEvent
      tags: [public]
      summary: Get public murder mystery event availability
      responses:
        "200":
          description: Public event details and current availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEvent"
  /admin/public-event-dates:
    get:
      operationId: listAdminPublicEventDates
      tags: [admin]
      summary: List scheduled public event dates
      security:
        - clerkSession: []
      responses:
        "200":
          description: Scheduled dates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicEventDate"
    post:
      operationId: createAdminPublicEventDate
      tags: [admin]
      summary: Schedule a public event date
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicEventDateInput"
      responses:
        "201":
          description: Date scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEventDate"
        "400":
          description: Invalid date or time
        "409":
          description: Six dates already scheduled or duplicate date and time
  /admin/public-event-dates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      operationId: updateAdminPublicEventDate
      tags: [admin]
      summary: Edit a scheduled public event date
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicEventDateInput"
      responses:
        "200":
          description: Updated date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEventDate"
        "400":
          description: Invalid date or time
        "404":
          description: Date not found
        "409":
          description: Date already has registrations or conflicts with another date
    delete:
      operationId: deleteAdminPublicEventDate
      tags: [admin]
      summary: Remove an unused scheduled date
      security:
        - clerkSession: []
      responses:
        "204":
          description: Date removed
        "404":
          description: Date not found
        "409":
          description: Date has registrations
  /public-event-signups:
    post:
      operationId: createPublicEventSignup
      tags: [public]
      summary: Join the next public murder mystery event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicEventSignupInput"
      responses:
        "201":
          description: Place reserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEventSignupResult"
        "400":
          description: Invalid signup details
        "409":
          description: Selected date is no longer available
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get booking pipeline summary
      security:
        - clerkSession: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
        "401":
          description: Authentication required
  /admin/pricing:
    get:
      operationId: getAdminPricing
      tags: [admin]
      summary: Get public experience pricing
      security:
        - clerkSession: []
      responses:
        "200":
          description: Current public pricing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingSettings"
        "401":
          description: Authentication required
    put:
      operationId: updateAdminPricing
      tags: [admin]
      summary: Update public experience pricing
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingSettings"
      responses:
        "200":
          description: Updated public pricing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingSettings"
        "400":
          description: Invalid pricing
        "401":
          description: Authentication required
  /admin/public-event-signups:
    get:
      operationId: listAdminPublicEventSignups
      tags: [admin]
      summary: List public murder mystery event registrations
      security:
        - clerkSession: []
      responses:
        "200":
          description: Public event registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicEventSignup"
        "401":
          description: Authentication required
  /admin/public-event-signups/{id}:
    patch:
      operationId: updateAdminPublicEventSignup
      tags: [admin]
      summary: Correct participant contact details without changing their group
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicEventSignupUpdate"
      responses:
        "200":
          description: Updated participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEventSignup"
        "400":
          description: Invalid participant details
        "401":
          description: Authentication required
        "404":
          description: Participant not found
    delete:
      operationId: deleteAdminPublicEventSignup
      tags: [admin]
      summary: Permanently remove a participant registration
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Participant removed
        "401":
          description: Authentication required
        "404":
          description: Participant not found
  /admin/public-event-signups/{id}/group:
    patch:
      operationId: moveAdminPublicEventSignup
      tags: [admin]
      summary: Move a participant to another group for the same date
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicEventGroupMove"
      responses:
        "200":
          description: Participant in new group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEventSignup"
        "400":
          description: Invalid group
        "401":
          description: Authentication required
        "404":
          description: Participant not found
        "409":
          description: Destination group is full or no longer available
  /admin/bookings:
    get:
      operationId: listAdminBookings
      tags: [admin]
      summary: List booking enquiries
      security:
        - clerkSession: []
      responses:
        "200":
          description: Booking enquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "401":
          description: Authentication required
  /admin/bookings/{id}:
    patch:
      operationId: updateAdminBooking
      tags: [admin]
      summary: Update a booking status or notes
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingUpdate"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          description: Authentication required
        "404":
          description: Booking not found
components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SiteContent:
      type: object
      required:
        - brand
        - experiences
        - steps
        - suspects
        - testimonials
        - faqs
      properties:
        brand:
          $ref: "#/components/schemas/BrandContent"
        experiences:
          type: array
          items:
            $ref: "#/components/schemas/Experience"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/HowItWorksStep"
        suspects:
          type: array
          items:
            $ref: "#/components/schemas/Suspect"
        testimonials:
          type: array
          items:
            $ref: "#/components/schemas/Testimonial"
        faqs:
          type: array
          items:
            $ref: "#/components/schemas/Faq"
    BrandContent:
      type: object
      required:
        - name
        - tagline
        - heroTitle
        - heroSubtitle
        - heroCopy
      properties:
        name:
          type: string
        tagline:
          type: string
        heroTitle:
          type: string
        heroSubtitle:
          type: string
        heroCopy:
          type: string
    Experience:
      type: object
      required:
        - id
        - name
        - label
        - description
        - priceLabel
        - features
      properties:
        id:
          type: string
        name:
          type: string
        label:
          type: string
        description:
          type: string
        priceLabel:
          type: string
        features:
          type: array
          items:
            type: string
    HowItWorksStep:
      type: object
      required:
        - number
        - title
        - description
      properties:
        number:
          type: integer
        title:
          type: string
        description:
          type: string
    Suspect:
      type: object
      required:
        - name
        - role
        - description
      properties:
        name:
          type: string
        role:
          type: string
        description:
          type: string
    Testimonial:
      type: object
      required:
        - quote
        - attribution
        - isSample
      properties:
        quote:
          type: string
        attribution:
          type: string
        isSample:
          type: boolean
    Faq:
      type: object
      required:
        - question
        - answer
      properties:
        question:
          type: string
        answer:
          type: string
    PricingSettings:
      type: object
      required:
        - signaturePriceLabel
        - customPriceLabel
      properties:
        signaturePriceLabel:
          type: string
          minLength: 1
          maxLength: 80
        customPriceLabel:
          type: string
          minLength: 1
          maxLength: 80
    PublicEvent:
      type: object
      required:
        - capacity
        - pricePerPerson
        - dates
      properties:
        capacity:
          type: integer
        pricePerPerson:
          type: integer
        dates:
          type: array
          items:
            $ref: "#/components/schemas/PublicEventDateAvailability"
    PublicEventDateInput:
      type: object
      required: [date, time, title]
      properties:
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        title:
          type: string
          minLength: 2
          maxLength: 120
    PublicEventDate:
      type: object
      required: [id, date, time, title, venue]
      properties:
        id:
          type: integer
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        time:
          type: string
        title:
          type: ["string", "null"]
        venue:
          type: string
    PublicEventDateAvailability:
      allOf:
        - $ref: "#/components/schemas/PublicEventDate"
        - type: object
          required: [eventNumber, signedUp, spotsRemaining]
          properties:
            eventNumber:
              type: integer
            signedUp:
              type: integer
            spotsRemaining:
              type: integer
    PublicEventSignupInput:
      type: object
      required:
        - eventDateId
        - name
        - email
        - address
        - phone
        - whatsapp
      properties:
        eventDateId:
          type: integer
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        address:
          type: string
          minLength: 5
          maxLength: 300
        phone:
          type: string
          minLength: 5
          maxLength: 30
        whatsapp:
          type: string
          minLength: 5
          maxLength: 30
    PublicEventSignupUpdate:
      type: object
      additionalProperties: false
      required: [name, address, phone, whatsapp]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        address: { type: string, maxLength: 300 }
        phone: { type: string, minLength: 5, maxLength: 30 }
        whatsapp: { type: string, minLength: 5, maxLength: 30 }
    PublicEventGroupMove:
      type: object
      additionalProperties: false
      required: [eventNumber]
      properties:
        eventNumber: { type: integer, minimum: 1 }
    PublicEventSignupResult:
      type: object
      required:
        - id
        - name
        - eventDateId
        - eventNumber
        - activeEventNumber
        - spotsRemaining
        - isFull
      properties:
        id:
          type: integer
        name:
          type: string
        eventDateId:
          type: integer
        eventNumber:
          type: integer
        activeEventNumber:
          type: integer
        spotsRemaining:
          type: integer
        isFull:
          type: boolean
    PublicEventSignup:
      allOf:
        - type: object
          required: [id, name, address, phone, whatsapp, eventDateId, eventNumber, createdAt]
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: ["string", "null"] }
            address: { type: string }
            phone: { type: string }
            whatsapp: { type: string }
            eventDateId: { type: ["integer", "null"] }
            eventNumber: { type: integer }
            createdAt: { type: string, format: date-time }
    BookingInput:
      type: object
      required:
        - firstName
        - surname
        - email
        - mobile
        - preferredDate
        - guests
        - experience
        - occasion
        - stayingInGreyton
        - consent
      properties:
        firstName:
          type: string
          minLength: 1
        surname:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        mobile:
          type: string
          minLength: 5
        preferredDate:
          type: string
          format: date
        alternativeDate:
          type: ["string", "null"]
          format: date
        guests:
          type: integer
          minimum: 6
          maximum: 6
        experience:
          type: string
          enum: [signature, custom, unsure]
        occasion:
          type: string
        stayingInGreyton:
          type: string
          enum: [yes, no, not_yet_booked]
        accommodation:
          type: ["string", "null"]
        specialRequests:
          type: ["string", "null"]
        consent:
          type: boolean
    Booking:
      allOf:
        - $ref: "#/components/schemas/BookingInput"
        - type: object
          required:
            - id
            - status
            - createdAt
          properties:
            id:
              type: integer
            status:
              type: string
              enum: [NEW, CONTACTED, AWAITING_DEPOSIT, CONFIRMED, COMPLETED, CANCELLED]
            createdAt:
              type: string
              format: date-time
            notes:
              type: ["string", "null"]
    BookingUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [NEW, CONTACTED, AWAITING_DEPOSIT, CONFIRMED, COMPLETED, CANCELLED]
        notes:
          type: ["string", "null"]
    PlayerProfileInput:
      type: object
      required:
        - name
        - ageRange
        - occupation
        - personality
        - hobbies
        - nickname
        - funniestHabit
        - groupReputation
        - favouriteSaying
        - closestTo
        - arguesWith
        - embarrassingStory
        - fictionalRole
        - offLimits
      properties:
        name:
          type: string
        ageRange:
          type: string
        occupation:
          type: string
        relationshipStatus:
          type: ["string", "null"]
        personality:
          type: string
        hobbies:
          type: string
        nickname:
          type: string
        funniestHabit:
          type: string
        groupReputation:
          type: string
        favouriteSaying:
          type: string
        closestTo:
          type: string
        arguesWith:
          type: string
        embarrassingStory:
          type: string
        fictionalRole:
          type: string
        offLimits:
          type: string
    CustomMysteryInput:
      type: object
      required:
        - contactName
        - email
        - mobile
        - preferredDate
        - guests
        - naughtiness
        - players
        - offLimits
        - consent
      properties:
        contactName:
          type: string
        email:
          type: string
          format: email
        mobile:
          type: string
        preferredDate:
          type: string
          format: date
        guests:
          type: integer
          minimum: 6
          maximum: 6
        naughtiness:
          type: string
          enum: [gentle, cheeky, juicy, outrageous]
        players:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/PlayerProfileInput"
        offLimits:
          type: string
        consent:
          type: boolean
    CustomMysteryEnquiry:
      type: object
      required:
        - id
        - contactName
        - status
        - createdAt
      properties:
        id:
          type: integer
        contactName:
          type: string
        status:
          type: string
          enum: [NEW, CONTACTED, AWAITING_DEPOSIT, CONFIRMED, COMPLETED, CANCELLED]
        createdAt:
          type: string
          format: date-time
    AdminDashboard:
      type: object
      required:
        - total
        - newCount
        - confirmedCount
        - upcomingCount
      properties:
        total:
          type: integer
        newCount:
          type: integer
        confirmedCount:
          type: integer
        upcomingCount:
          type: integer

